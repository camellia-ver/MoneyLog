<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyLog - Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="container py-4">
        <h1 class="auth-title">MoneyLog</h1>

        <!-- Summary Card -->
        <div class="card-custom mb-4">
            <p class="text-secondary mb-1">이번 달 소비</p>
            <h2 id="totalAmount">₩0</h2>
        </div>

        <!-- Category Summary -->
        <div class="card-custom mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">카테고리별 지출</h5>
                <button type="button" class="btn btn-secondary-custom btn-sm"
                        data-bs-toggle="modal" data-bs-target="#categoryModal">
                    + 카테고리 추가
                </button>
            </div>
            <ul id="categoryList" class="list-unstyled"></ul>
        </div>

        <!-- Recent Expenses -->
        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">최근 지출</h5>
                <button type="button" class="btn btn-primary-custom btn-sm"
                        data-bs-toggle="modal" data-bs-target="#expenseModal">
                    + 지출 추가
                </button>
            </div>
            <ul id="expenseList" class="list-unstyled"></ul>
        </div>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">카테고리 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">카테고리명</label>
                            <input type="text" class="form-control input-custom" id="categoryName" required>
                        </div>
                        <div id="categoryErrorMessage" class="text-danger mb-3 d-none"></div>
                        <button type="submit" class="btn btn-primary-custom w-100">추가하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">지출 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="expenseForm">
                        <div class="mb-3">
                            <label for="expenseCategoryId" class="form-label">카테고리</label>
                            <select class="form-select input-custom" id="expenseCategoryId" required>
                                <!-- JS가 여기에 option들을 동적으로 채울 예정 -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="expenseAmount" class="form-label">금액</label>
                            <input type="number" class="form-control input-custom" id="expenseAmount" required>
                        </div>
                        <div class="mb-3">
                            <label for="expenseContent" class="form-label">내용</label>
                            <input type="text" class="form-control input-custom" id="expenseContent" required>
                        </div>
                        <div class="mb-3">
                            <label for="expenseMemo" class="form-label">메모</label>
                            <input type="text" class="form-control input-custom" id="expenseMemo">
                        </div>
                        <div id="expenseErrorMessage" class="text-danger mb-3 d-none"></div>
                        <button type="submit" class="btn btn-primary-custom w-100">추가하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
