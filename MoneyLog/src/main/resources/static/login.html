<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyLog - 로그인</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
        <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card-custom" style="width: 100%; max-width: 400px;">
            <h1 class="auth-title">MoneyLog</h1>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" class="form-control input-custom" id="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control input-custom" id="password" required>
                </div>

                <div id="errorMessage" class="auth-error-message mb-3 d-none">

                </div>

                <button type="submit" class="btn btn-primary-custom w-100">로그인</button>
            </form>

            <p class="auth-helper-text text-center mt-3">
                계정이 없으신가요? <a href="signup">회원가입</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
