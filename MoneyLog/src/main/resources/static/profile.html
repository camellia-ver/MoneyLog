<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyLog - Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="container py-4" style="max-width: 500px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="auth-title mb-0">내 정보</h1>
            <a href="dashboard" class="btn btn-secondary-custom btn-sm">대시보드로</a>
        </div>

        <!-- userName 수정 -->
        <div class="card-custom mb-4">
            <h5 class="mb-3">사용자명 변경</h5>
            <form id="usernameForm">
                <div class="mb-3">
                    <label for="newUserName" class="form-label">새 사용자명</label>
                    <input type="text" class="form-control input-custom" id="newUserName" required>
                </div>
                <div id="usernameErrorMessage" class="text-danger mb-3 d-none"></div>
                <button type="submit" class="btn btn-primary-custom w-100">변경하기</button>
            </form>
        </div>

        <!-- 비밀번호 변경 -->
        <div class="card-custom mb-4">
            <h5 class="mb-3">비밀번호 변경</h5>
            <form id="passwordForm">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">현재 비밀번호</label>
                    <input type="password" class="form-control input-custom" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">새 비밀번호</label>
                    <input type="password" class="form-control input-custom" id="newPassword" required>
                </div>
                <div id="passwordErrorMessage" class="text-danger mb-3 d-none"></div>
                <button type="submit" class="btn btn-primary-custom w-100">변경하기</button>
            </form>
        </div>

        <!-- 계정삭제 -->
        <div class="card-custom mb-4" style="border: 1px solid var(--color-expense);">
            <h5 class="mb-3" style="color: var(--color-expense);">계정 삭제</h5>
            <p class="text-secondary" style="font-size: 14px;">
                계정을 삭제하면 모든 데이터가 영구적으로 삭제되며 복구할 수 없습니다.
            </p>
            <button type="button" class="btn btn-outline-danger w-100"
                    data-bs-toggle="modal" data-bs-target="#deleteAccountModal">
                계정 삭제
            </button>
        </div>
    </div>
    
    <div class="modal fade" id="deleteAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">계정 삭제 확인</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-secondary">비밀번호를 입력하여 계정 삭제를 확인해주세요.</p>
                    <form id="deleteAccountForm">
                        <div class="mb-3">
                            <label for="deletePassword" class="form-label">비밀번호</label>
                            <input type="password" class="form-control input-custom" id="deletePassword" required>
                        </div>
                        <div id="deleteErrorMessage" class="text-danger mb-3 d-none"></div>
                        <button type="submit" class="btn btn-outline-danger w-100">계정 삭제</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
