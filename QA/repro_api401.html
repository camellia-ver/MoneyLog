<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>api.js 401 repro</title></head>
<body>
<div id="result">RUNNING</div>
<script src="./auth_copy.js"></script>
<script src="./api_copy.js"></script>
<script>
(async function(){
  window.alert = function(msg) { window.__alertMsg = msg; }; // headless 환경에서 alert 다이얼로그가 실행을 블로킹하므로 캡처용으로만 대체(로직 자체는 api.js 원본 그대로 실행)
  // 결과 캡처를 위해 결과 페이지로의 실제 네비게이션(window.location.href='login')이 리포트 출력을 가리지 않도록
  // publicPages(["/","/login","/signup"])에 해당하는 경로로 pushState (api.js의 리다이렉트 분기 자체는 코드리뷰로 이미 확인됨. 여기서는 clearToken() 미작동 재현이 핵심 목적)
  history.pushState({}, "", "/login");
  localStorage.clear();
  saveToken("INVALID.TOKEN.VALUE"); // 위조된 토큰 -> 실제 백엔드가 401 반환

  let caughtError = null;
  try {
    await apiRequest("/api/categories"); // 실제 로컬 서버(8080)에 실제 HTTP 요청
  } catch (e) {
    caughtError = e.message;
  }

  const report = {
    "호출_전_token값": "INVALID.TOKEN.VALUE",
    "401_이후_localStorage_token값(정상이면_null)": localStorage.getItem("token"),
    "apiRequest_예외메시지": caughtError,
    "현재_pathname(퍼블릭페이지라_리다이렉트_생략됨)": window.location.pathname,
    "판정": localStorage.getItem("token") !== null
      ? "FAIL - 실제 백엔드 401 응답 후에도 clearToken()이 토큰을 삭제하지 못함(버그 재현)"
      : "PASS"
  };
  document.getElementById("result").innerText = JSON.stringify(report, null, 2);
})();
</script>
</body>
</html>
