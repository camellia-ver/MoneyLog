<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QA retest dashboard (temp, not part of app)</title>
</head>
<body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="auth-title mb-0">MoneyLog</h1>
        <button id="logoutButton" class="btn btn-secondary-custom btn-sm">로그아웃</button>
    </div>

    <div class="card-custom mb-4">
        <p class="text-secondary mb-1">이번 달 소비</p>
        <div class="d-flex align-items-baseline">
            <h2 id="totalAmount" class="mb-0 me-2">₩0</h2>
            <span id="changeRate"></span>
        </div>
    </div>

    <div class="card-custom mb-4">
        <form id="filterForm" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label for="filterStartDate" class="form-label">시작일</label>
                <input type="date" class="form-control input-custom" id="filterStartDate">
            </div>
            <div class="col-md-3">
                <label for="filterEndDate" class="form-label">종료일</label>
                <input type="date" class="form-control input-custom" id="filterEndDate">
            </div>
            <div class="col-md-3">
                <label for="filterCategoryId" class="form-label">카테고리</label>
                <select class="form-select input-custom" id="filterCategoryId">
                    <option value="">전체</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary-custom w-100">조회</button>
            </div>
        </form>
    </div>

    <div class="card-custom mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">카테고리별 지출</h5>
            <button type="button" class="btn btn-secondary-custom btn-sm"
                    data-bs-toggle="modal" data-bs-target="#categoryModal">
                + 카테고리 추가
            </button>
        </div>
        <canvas id="categoryChart" style="max-height: 250px;"></canvas>
        <ul id="categoryList" class="list-unstyled mt-3"></ul>
    </div>

        <div class="card-custom mb-4">
            <h5 class="mb-3">카테고리 관리</h5>
            <ul id="categoryManageList" class="list-unstyled"></ul>
        </div>

        <div class="card-custom">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">최근 지출</h5>
                <button type="button" class="btn btn-primary-custom btn-sm"
                        data-bs-toggle="modal" data-bs-target="#expenseModal">
                    + 지출 추가
                </button>
            </div>
            <ul id="expenseList" class="list-unstyled"></ul>
        </div>
    </div>

    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">카테고리 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">카테고리명</label>
                            <input type="text" class="form-control input-custom" id="categoryName" required>
                        </div>
                        <div id="categoryErrorMessage" class="text-danger mb-3 d-none"></div>
                        <button type="submit" class="btn btn-primary-custom w-100">추가하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">지출 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="expenseForm">
                        <div class="mb-3">
                            <label for="expenseCategoryId" class="form-label">카테고리</label>
                            <select class="form-select input-custom" id="expenseCategoryId" required></select>
                        </div>
                        <div class="mb-3">
                            <label for="expenseAmount" class="form-label">금액</label>
                            <input type="number" class="form-control input-custom" id="expenseAmount" required>
                        </div>
                        <div class="mb-3">
                            <label for="expenseContent" class="form-label">내용</label>
                            <input type="text" class="form-control input-custom" id="expenseContent" required>
                        </div>
                        <div class="mb-3">
                            <label for="expenseMemo" class="form-label">메모</label>
                            <input type="text" class="form-control input-custom" id="expenseMemo">
                        </div>
                        <div id="expenseErrorMessage" class="text-danger mb-3 d-none"></div>
                        <button type="submit" class="btn btn-primary-custom w-100">추가하기</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      // QA STEP4 재검증: 실제 dashboard.js/api.js/auth.js를 같은 오리진(http://localhost:8080)에서
      // 그대로 로드하기 전에, 실제 로그인 API로 발급받은 유효 토큰을 주입 (CORS 우회 아님, 실제 앱과 동일한 오리진에서 실행)
      localStorage.setItem("token", "eyJhbGciOiJIUzUxMiJ9.eyJzdWIiOiI1MCIsInJvbGUiOiJVU0VSIiwiaWF0IjoxNzg2MTY4MTg0LCJleHAiOjE3ODYxNzE3ODR9.eUd2G_sWOH21lNMXQ-WhUvosbTjl4fzx6d8gS0UIihT19vp8TjmZcu21ToM3umz-S5IO58Od2Gp7u85VZC_0Ow");
    </script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
      setTimeout(async function () {
        // TC-067: 도넛차트가 실제로 Chart.js 인스턴스로 렌더링되었는지 확인
        const chartCreated = (typeof categoryChart === "object" && categoryChart !== null && categoryChart.config.type === "doughnut");
        const chartDataPoints = chartCreated ? categoryChart.data.datasets[0].data : null;

        // TC-069: 지출 등록 모달을 열었을 때 카테고리 select가 실제 카테고리로 동기화되는지 확인
        const expenseModalShownEvent = new Event("shown.bs.modal");
        document.getElementById("expenseModal").dispatchEvent(expenseModalShownEvent);
        await new Promise(r => setTimeout(r, 200));
        const expenseCategorySelectHTML = document.getElementById("expenseCategoryId").innerHTML;

        // TC-068: 필터 폼 제출 시 실제로 DOM이 다른 데이터로 갱신되는지 확인 (7월 한정 조회 -> 8월 지출은 사라지고 7월 지출만 남아야 함)
        document.getElementById("filterStartDate").value = "2026-07-01";
        document.getElementById("filterEndDate").value = "2026-07-31";
        document.getElementById("filterForm").dispatchEvent(new Event("submit", { cancelable: true }));
        await new Promise(r => setTimeout(r, 1000));
        const filteredTotalAmount = document.getElementById("totalAmount").innerText;
        const filteredExpenseListHTML = document.getElementById("expenseList").innerHTML;

        const resultDiv = document.createElement("div");
        resultDiv.id = "qa-result";
        resultDiv.innerText = JSON.stringify({
          totalAmount_텍스트: document.getElementById("totalAmount").innerText,
          changeRate_텍스트: document.getElementById("changeRate").innerText,
          changeRate_color_style: document.getElementById("changeRate").style.color,
          categoryList_HTML: document.getElementById("categoryList").innerHTML,
          expenseList_HTML: document.getElementById("expenseList").innerHTML,
          TC067_도넛차트_생성됨: chartCreated,
          TC067_차트_데이터포인트: chartDataPoints,
          TC069_지출모달_카테고리select_HTML: expenseCategorySelectHTML,
          TC068_필터적용후_totalAmount: filteredTotalAmount,
          TC068_필터적용후_expenseList_HTML: filteredExpenseListHTML,
        }, null, 2);
        document.body.appendChild(resultDiv);
      }, 3000);
    </script>
</body>
</html>
