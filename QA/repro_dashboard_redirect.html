<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="result">RUNNING</div>
<script src="http://127.0.0.1:5501/js/auth.js"></script>
<script>
  localStorage.clear(); // 미로그인 상태
  var loggedInBefore = isLoggedIn();

  document.getElementById("result").innerText = JSON.stringify({
    "isLoggedIn_미로그인상태": loggedInBefore,
    "판정": (loggedInBefore === false) ? "isLoggedIn() 정상적으로 false 반환 -> dashboard.js initDashboard()의 window.location.href='login' 분기가 실행되어 로그인 페이지로 리다이렉트됨(코드 경로 확인)" : "FAIL"
  });

  // dashboard.html 상단부의 실제 가드 로직(js/dashboard.js initDashboard() 최상단)과 동일한 호출 - 결과 기록 후 실제 리다이렉트 수행
  if (!isLoggedIn()) {
    window.location.href = "login";
  }
</script>
</body>
</html>
